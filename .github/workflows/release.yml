name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: macos-latest
            target: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    env:
      APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifications
        run: |
          node --check server.js
          node --check electron/main.js
          node --check public/app.js
      - name: Tests de bout en bout du serveur (faux claude)
        run: npm test
      - name: Tests de l'application Electron (Playwright)
        run: npm run test:app
      - name: Empaquetage
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Paquet Microsoft Store (si les identifiants Partner Center sont configurés)
        if: matrix.os == 'windows-latest' && env.APPX_PUBLISHER != ''
        env:
          APPX_IDENTITY_NAME: ${{ secrets.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ secrets.APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          node scripts/store-identity.js
          npx electron-builder --win appx --publish never
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && env.APPX_PUBLISHER != ''
        with:
          name: store-package
          path: dist/*.appx
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*   # installeurs seulement (le paquet Store part vers Partner Center, pas dans la release)
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
