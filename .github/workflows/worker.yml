name: Worker de synchro

# Tests du Worker (wrangler dev local, D1 + R2 locaux) à chaque modification de sync-worker/ ;
# déploiement sur Cloudflare au tag v* si le secret CLOUDFLARE_API_TOKEN est configuré
# (jeton « Edit Cloudflare Workers » + D1 + R2 ; CLOUDFLARE_ACCOUNT_ID en variable ou secret).
on:
  push:
    branches: [main]
    paths: ['sync-worker/**', '.github/workflows/worker.yml']
    tags: ['v*']
  pull_request:
    paths: ['sync-worker/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Jeton Cloudflare présent ?
        id: tok
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::CLOUDFLARE_API_TOKEN absent : déploiement ignoré"; fi
      - if: steps.tok.outputs.ok == '1'
        run: npm install --no-audit --no-fund
      # migrations (déjà appliquées : « duplicate column » ignoré ; base neuve : « no such table » ignoré),
      # puis schéma (uniquement des CREATE ... IF NOT EXISTS)
      - if: steps.tok.outputs.ok == '1'
        run: |
          for f in migrations/*.sql; do
            out=$(npx wrangler d1 execute csm-sync --remote --file "$f" 2>&1) && { echo "$f appliquée"; continue; }
            echo "$out" | grep -qiE 'duplicate column|no such table' && { echo "$f déjà appliquée ou inutile"; continue; }
            echo "$out"; exit 1
          done
      - if: steps.tok.outputs.ok == '1'
        run: npx wrangler d1 execute csm-sync --remote --file schema.sql
      - if: steps.tok.outputs.ok == '1'
        run: npx wrangler deploy
